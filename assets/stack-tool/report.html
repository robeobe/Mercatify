<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack consolidation report — Mercatify</title>
<link rel="stylesheet" href="tool.css">
<style>
  .rep-head { padding: 48px 0 28px; border-bottom: 1px solid var(--rule); }
  .rep-head .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12.5px; margin-top: 18px; }
  .verdict-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; border: 1px solid var(--rule-strong); }
  .verdict-bar span { display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  .sw-native { background: var(--accent); }
  .sw-configure { background: var(--violet); }
  .sw-build { background: var(--yellow); }
  .sw-integrate { background: var(--rule-strong); }
  .sw-keep { background: var(--surface-2); }
  .sw-drop { background: transparent; border: 1px dashed var(--rule-strong); }
  #rep table { min-width: 860px; }
  .lines td { font-size: 13px; }
  .lines .tot td { font-weight: 600; border-top: 1px solid var(--rule-strong); }
</style>
</head>
<body>

<header class="topbar no-print">
  <div class="brand"><span class="mark" aria-hidden="true">M</span> Mercatify</div>
  <nav class="steps" aria-label="Steps">
    <a class="step" href="intake.html"><span class="n">01</span> Intake</a>
    <a class="step" href="mapping.html"><span class="n">02</span> Mapping</a>
    <a class="step" href="report.html" aria-current="page"><span class="n">03</span> Report</a>
  </nav>
  <button class="btn btn--ghost btn--sm" id="theme" type="button">Theme</button>
  <button class="btn btn--sm" id="print" type="button">Print / Save as PDF</button>
</header>

<main class="wrap wrap--narrow">

  <section class="card no-print" id="loader">
    <h3 style="margin-bottom:10px">Load a mapping</h3>
    <div class="io">
      <label for="in">Paste the mapping from step 02, or load the one in this browser</label>
      <textarea id="in" spellcheck="false" placeholder='{ "kind": "mercatify-mapping", … }'></textarea>
      <div class="row">
        <button class="btn" type="button" id="load">Generate report</button>
        <button class="btn btn--ghost" type="button" id="load-local">Load from this browser</button>
        <label class="btn btn--ghost" for="file" style="margin:0">Open .json file</label>
        <input type="file" id="file" accept="application/json,.json" style="display:none">
        <span class="hint" id="load-msg"></span>
      </div>
    </div>
  </section>

  <div id="rep" hidden></div>

  <p class="footer">Mercatify · SaaS-to-Open-Mercato consolidation. Costs are client-provided;
     every figure on this page is a multiplication of the table above it.</p>
</main>

<script src="catalog.js"></script>
<script>
(function(){
  initTheme('theme');
  document.getElementById('print').addEventListener('click', function(){ window.print(); });

  function parseJSON(text){
    var t = (text || '').trim();
    var i = t.indexOf('{'), j = t.lastIndexOf('}');
    if (i === -1 || j === -1) return null;
    try { return JSON.parse(t.slice(i, j + 1)); } catch (e) { return null; }
  }
  function msg(text, ok){
    var m = document.getElementById('load-msg');
    m.textContent = text;
    m.style.color = ok ? 'var(--accent-text)' : 'var(--ink-2)';
  }

  document.getElementById('load').addEventListener('click', function(){
    var d = parseJSON(document.getElementById('in').value);
    if (!d || !d.rows) { msg('That is not a mapping — copy it from step 02.', false); return; }
    build(d);
  });
  document.getElementById('load-local').addEventListener('click', function(){
    var c = loadCase();
    if (!c || !c.mapping || !c.mapping.rows) { msg('No mapping saved in this browser yet.', false); return; }
    build(c.mapping);
  });
  document.getElementById('file').addEventListener('change', function(e){
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      var d = parseJSON(String(r.result));
      if (!d || !d.rows) { msg('That file is not a mapping.', false); return; }
      build(d);
    };
    r.readAsText(f);
  });

  /* ---------- report ---------- */
  function build(d){
    var cur = d.currency || 'EUR';
    var t = computeTotals(d);
    var rows = d.rows || [];
    var tools = d.tools || [];

    function rowsOf(toolId){ return rows.filter(function(r){ return r.toolId === toolId; }); }
    function retained(tool){
      return rowsOf(tool.id).some(function(r){ return r.verdict === 'keep' || r.verdict === 'integrate'; });
    }
    var cancelled = tools.filter(function(x){ return !retained(x); });
    var covered = tools.filter(function(x){
      var rs = rowsOf(x.id);
      return rs.length && rs.every(function(r){ return r.verdict === 'native' || r.verdict === 'configure' || r.verdict === 'drop'; });
    });
    var buildRows = rows.filter(function(r){ return r.verdict === 'build'; });
    var counts = {};
    Object.keys(VERDICTS).forEach(function(k){ counts[k] = rows.filter(function(r){ return r.verdict === k; }).length; });
    var decided = Object.keys(counts).reduce(function(s, k){ return s + counts[k]; }, 0);

    var rep = document.getElementById('rep');
    rep.innerHTML = '';
    rep.hidden = false;
    document.getElementById('loader').hidden = true;

    /* header */
    var head = el('section', { class:'rep-head' });
    head.appendChild(el('p', { class:'eyebrow', text: 'Stack consolidation · ' + (d.company.name || 'unnamed case') }));
    var headline = cancelled.length
      ? cancelled.length + ' of your ' + tools.length + ' tools can be switched off.'
      : 'Every tool in your stack earns its place — for now.';
    head.appendChild(el('h1', { text: headline }));
    var covers = counts.native + counts.configure;
    var summary = 'You pay ' + money(t.monthlyNow, cur) + ' a month across ' + tools.length + ' tools. ' +
      'Of the ' + rows.length + ' things you actually do in them, ' + covers +
      (covers === 1 ? ' is' : ' are') + ' covered by Open Mercato' +
      (covered.length ? ' — ' + covered.length + (covered.length === 1 ? ' tool is' : ' tools are') + ' covered end to end' : '') + '. ' +
      (counts.build ? counts.build + (counts.build === 1 ? ' thing genuinely needs' : ' things genuinely need') + ' building: ' + t.hours + ' hours. ' : '') +
      (counts.keep + counts.integrate ? plural(counts.keep + counts.integrate, 'tool') + ' stays where it is' + (counts.keep + counts.integrate === 1 ? '' : ' — both on purpose') + '.' : '');
    head.appendChild(el('p', { class:'lede', text: summary }));
    var meta = el('div', { class:'meta' });
    [ d.created || '', d.company.industry || '', (d.company.people ? d.company.people + ' people' : ''),
      (t.seats ? t.seats + ' seats' : ''), (d.assumptions && d.assumptions.analyst ? 'reviewed by ' + d.assumptions.analyst : 'not yet reviewed') ]
      .filter(Boolean).forEach(function(x){ meta.appendChild(el('span', { text: x })); });
    head.appendChild(meta);
    rep.appendChild(head);

    /* KPI tiles */
    var kpis = el('div', { class:'grid grid--4', style:'margin:26px 0 8px' });
    function kpi(k, v, s, cls){
      kpis.appendChild(el('div', { class:'kpi ' + (cls || '') }, [
        el('div', { class:'k', text:k }), el('div', { class:'v', text:v }), el('div', { class:'s', text:s })
      ]));
    }
    kpi('Licences today', money(t.monthlyNow, cur), 'per month · ' + tools.length + ' tools');
    kpi('Licences after', money(t.monthlyAfter, cur), t.hosting ? 'per month · incl. ' + money(t.hosting, cur) + ' hosting' : 'per month · hosting not costed');
    kpi('Net saving', money(t.annualSaving, cur), 'per year · ' + plural(cancelled.length, 'tool') + ' cancelled', 'kpi--accent');
    kpi(t.oneOff ? 'One-off build' : 'Build effort',
        t.oneOff ? money(t.oneOff, cur) : t.hours + ' h',
        t.breakEven ? t.hours + ' h · break-even month ' + t.breakEven
          : (t.hours ? t.hours + ' h · rate not entered' : 'nothing to build'));
    rep.appendChild(kpis);

    /* verdict bar */
    if (decided) {
      var bar = el('div', { class:'verdict-bar' });
      Object.keys(VERDICTS).forEach(function(k){
        if (!counts[k]) return;
        bar.appendChild(el('span', { class:'sw-' + k, style:'width:' + (counts[k] / decided * 100) + '%' }));
      });
      var legend = el('div', { class:'legend' });
      Object.keys(VERDICTS).forEach(function(k){
        if (!counts[k]) return;
        legend.appendChild(el('span', { html: '<i class="sw-' + k + '"></i>' + counts[k] + ' ' + VERDICTS[k].label }));
      });
      var wrapBar = el('section', { class:'card card--plain' }, [bar, legend]);
      rep.appendChild(wrapBar);
    }

    /* tool by tool */
    rep.appendChild(el('div', { class:'section' }, [
      el('h2', { text:'Tool by tool' }),
      el('p', { text:'One verdict per module, each with the evidence behind it. A tool appears more than once when it does more than one job.' })
    ]));

    var tw = el('div', { class:'tablewrap' });
    var table = el('table');
    var thead = el('thead', {}, [ el('tr', {}, [
      el('th', { scope:'col', text:'Tool · module' }),
      el('th', { scope:'col', text:'What it is used for' }),
      el('th', { scope:'col', text:'Open Mercato' }),
      el('th', { scope:'col', text:'Verdict' }),
      el('th', { scope:'col', text:'Confidence' }),
      el('th', { scope:'col', class:'num', text:'Monthly' })
    ])]);
    table.appendChild(thead);
    var tb = el('tbody');
    tools.forEach(function(tool){
      var rs = rowsOf(tool.id);
      rs.forEach(function(r, idx){
        var tr = el('tr');
        tr.appendChild(el('td', {}, [
          el('div', { text: idx === 0 ? tool.name : '' }),
          el('div', { class:'sub', text: r.modName })
        ]));
        tr.appendChild(el('td', {}, [
          el('div', { text: r.usage || '—' }),
          r.note ? el('div', { class:'sub', text: r.note }) : document.createTextNode('')
        ]));
        tr.appendChild(el('td', {}, [ el('div', { text: r.om || '—' }) ]));
        tr.appendChild(el('td', {}, [ r.verdict
          ? el('span', { class:'chip chip--' + r.verdict, text: VERDICTS[r.verdict].label })
          : el('span', { class:'chip', text:'undecided' }) ]));
        tr.appendChild(el('td', {}, [ el('span', { class:'sub', text: r.conf || '—' }) ]));
        tr.appendChild(el('td', { class:'num' }, [
          el('div', { text: idx === 0 ? (tool.monthly ? money(tool.monthly, cur) : '—') : '' }),
          idx === 0 && !retained(tool) ? el('div', { class:'sub', text:'cancelled' }) : document.createTextNode('')
        ]));
        tb.appendChild(tr);
      });
    });
    table.appendChild(tb);
    tw.appendChild(table);
    rep.appendChild(tw);

    /* duplicates */
    var ov = overlaps(tools);
    if (ov.length) {
      rep.appendChild(el('div', { class:'section' }, [
        el('h2', { text:'You pay twice for these' }),
        el('p', { text:'Same job, more than one invoice. This is where consolidation pays before a single line of code is written.' })
      ]));
      var dw = el('div', { class:'tablewrap' });
      var dt = el('table');
      dt.appendChild(el('thead', {}, [ el('tr', {}, [
        el('th', { scope:'col', text:'Capability' }),
        el('th', { scope:'col', text:'Covered by' }),
        el('th', { scope:'col', class:'num', text:'Tools' })
      ])]));
      var dtb = el('tbody');
      ov.forEach(function(o){
        dtb.appendChild(el('tr', {}, [
          el('td', {}, [ el('strong', { text: o.label }) ]),
          el('td', {}, [ el('span', { text: o.tools.map(function(x){ return x.toolName + ' (' + x.moduleName + ')'; }).join(', ') }) ]),
          el('td', { class:'num', text: String(o.tools.length) })
        ]));
      });
      dt.appendChild(dtb);
      dw.appendChild(dt);
      rep.appendChild(dw);
    }

    /* build backlog */
    rep.appendChild(el('div', { class:'section' }, [
      el('h2', { text:'What genuinely has to be built' }),
      el('p', { text: buildRows.length ? 'Everything else is configuration. These are the hours in the quote.'
                                       : 'Nothing on this list needs new code. Everything you use is configuration.' })
    ]));
    if (buildRows.length) {
      var bw = el('div', { class:'tablewrap' });
      var bt = el('table');
      bt.appendChild(el('thead', {}, [ el('tr', {}, [
        el('th', { scope:'col', text:'What' }),
        el('th', { scope:'col', text:'Replaces' }),
        el('th', { scope:'col', text:'Confidence' }),
        el('th', { scope:'col', class:'num', text:'Hours' }),
        el('th', { scope:'col', class:'num', text:'Cost' })
      ])]));
      var btb = el('tbody');
      buildRows.forEach(function(r){
        btb.appendChild(el('tr', {}, [
          el('td', {}, [ el('div', { text: r.om || r.modName }), el('div', { class:'sub', text: r.note || '' }) ]),
          el('td', {}, [ el('div', { text: r.toolName + ' · ' + r.modName }) ]),
          el('td', { text: r.conf || '—' }),
          el('td', { class:'num', text: (Number(r.hours) || 0) + ' h' }),
          el('td', { class:'num', text: t.rate ? money((Number(r.hours) || 0) * t.rate, cur) : '—' })
        ]));
      });
      btb.appendChild(el('tr', { class:'tot' }, [
        el('td', { text:'Total' }), el('td', {}), el('td', {}),
        el('td', { class:'num', text: t.hours + ' h' }),
        el('td', { class:'num', text: t.rate ? money(t.oneOff, cur) : '—' })
      ]));
      bt.appendChild(btb);
      bw.appendChild(bt);
      rep.appendChild(bw);
    }

    /* the money, line by line */
    rep.appendChild(el('div', { class:'section' }, [
      el('h2', { text:'What it costs, what it returns' }),
      el('p', { text:'Computed from the numbers you gave us. Every line can be recomputed by hand in the room.' })
    ]));
    var mw = el('div', { class:'tablewrap' });
    var mt = el('table', { class:'lines' });
    mt.appendChild(el('thead', {}, [ el('tr', {}, [
      el('th', { scope:'col', text:'Line' }),
      el('th', { scope:'col', text:'Basis' }),
      el('th', { scope:'col', class:'num', text:'Amount' })
    ])]));
    var mtb = el('tbody');
    function line(k, basis, val, cls){
      mtb.appendChild(el('tr', { class: cls || '' }, [
        el('td', { text:k }), el('td', { class:'sub', text:basis }), el('td', { class:'num', text:val })
      ]));
    }
    line('Licences today', tools.length + ' tools as invoiced', money(t.monthlyNow, cur) + '/mo');
    line('Licences retained', tools.filter(function(x){ return (Number(x.after) || 0) > 0; })
         .map(function(x){ return x.name; }).join(', ') || 'none',
         money(t.retained, cur) + '/mo');
    line('Hosting & ops', d.assumptions && d.assumptions.hosting ? 'client-provided estimate' : 'not entered',
         money(t.hosting, cur) + '/mo');
    line('Monthly after', 'retained + hosting', money(t.monthlyAfter, cur) + '/mo');
    line('Monthly saving', 'today − after', money(t.monthlySaving, cur) + '/mo');
    line('Annual saving', 'monthly saving × 12', money(t.annualSaving, cur) + '/yr', 'tot');
    if (t.rate) {
      line('One-off build', t.hours + ' h × ' + money(t.rate, cur) + '/h', money(t.oneOff, cur));
      line('Break-even', t.breakEven ? 'one-off ÷ monthly saving' : 'no saving to pay it back',
           t.breakEven ? 'month ' + t.breakEven : '—', 'tot');
    }
    mt.appendChild(mtb);
    mw.appendChild(mt);
    rep.appendChild(mw);

    /* what they told us */
    if (d.pains || d.mustKeep) {
      rep.appendChild(el('div', { class:'section' }, [ el('h2', { text:'In their own words' }) ]));
      var c = el('section', { class:'card' });
      if (d.pains) { c.appendChild(el('h3', { text:'What hurts today' })); c.appendChild(el('p', { class:'note', text: d.pains })); }
      if (d.mustKeep) { c.appendChild(el('h3', { text:'What must not be touched' })); c.appendChild(el('p', { class:'note', text: d.mustKeep })); }
      rep.appendChild(c);
    }

    /* assumptions */
    rep.appendChild(el('div', { class:'section' }, [
      el('h2', { text:'Assumptions and what we are not sure about' }),
      el('p', { text:'Confidence is a band, not a decimal. Anything marked low is a conversation, not a commitment.' })
    ]));
    var ac = el('section', { class:'card' });
    var lows = rows.filter(function(r){ return r.conf === 'low'; });
    var ul = el('ul', { style:'margin:0;padding-left:18px;color:var(--ink-2)' });
    if (d.assumptions && d.assumptions.notes) {
      d.assumptions.notes.split('\n').filter(Boolean).forEach(function(n){ ul.appendChild(el('li', { text: n })); });
    }
    lows.forEach(function(r){
      ul.appendChild(el('li', { text: r.toolName + ' · ' + r.modName + ' — low confidence' + (r.note ? ': ' + r.note : '') }));
    });
    var unmapped = rows.filter(function(r){ return !r.caps || !r.caps.length; });
    unmapped.forEach(function(r){
      ul.appendChild(el('li', { text: r.toolName + ' is off catalog — reported as unmapped rather than guessed at' }));
    });
    var undecided = rows.filter(function(r){ return !r.verdict; });
    if (undecided.length) ul.appendChild(el('li', { text: undecided.length + ' modules have no verdict yet — this report is a draft' }));
    if (!ul.childNodes.length) ul.appendChild(el('li', { text:'No open questions recorded.' }));
    ac.appendChild(ul);
    rep.appendChild(ac);

    /* next step */
    var next = el('section', { class:'card', style:'margin-top:26px' });
    next.appendChild(el('h3', { text:'The first piece worth cutting' }));
    var first = cancelled.slice().sort(function(a, b){ return (Number(b.monthly) || 0) - (Number(a.monthly) || 0); })[0];
    next.appendChild(el('p', { class:'note', text: first
      ? first.name + ' — ' + (first.monthly ? money(first.monthly, cur) + ' a month, ' + money((Number(first.monthly) || 0) * 12, cur) + ' a year' : 'no cost on file')
        + '. Everything it does is covered. We never propose replacing a stack; we name one piece, and then the next.'
      : 'Nothing is cancellable on the current verdicts. Worth re-reading the table before this goes to a client.' }));
    rep.appendChild(next);

    rep.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  /* auto-load whatever this browser is holding */
  var c = loadCase();
  if (c && c.mapping && c.mapping.rows && c.mapping.rows.length) build(c.mapping);
  else msg('Nothing in this browser yet — paste a mapping from step 02.', false);
})();
</script>
</body>
</html>
