<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report — Mercatify</title>
<link rel="stylesheet" href="../shared/om.css">
<style>
  /* The preview is framed so nobody mistakes it for the console's own page —
     what is inside the frame is literally what the client opens. */
  .preview {
    border: 1px solid var(--border); border-radius: var(--radius-xl);
    background: var(--background); overflow: hidden;
  }
  .preview__chrome {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--muted);
    font-size: 0.75rem; color: var(--muted-foreground);
  }
  .preview__dot { width: 8px; height: 8px; border-radius: 999px; background: var(--border); }
  .preview__body { padding: 24px; }
  .compose { display: grid; gap: 12px; }
</style>
</head>
<body>

<div id="shell"></div>

<template id="tpl">
  <div class="pagehead">
    <div class="pagehead__text">
      <h1>Report</h1>
      <p>Built from the confirmed mapping, your corrections included. Write the two human bits,
         read the preview, then send it. Nothing reaches the client until you press send.</p>
    </div>
    <div class="pagehead__actions">
      <a class="btn btn--outline" id="to-mapping">← Back to mapping</a>
      <button class="btn btn--outline" type="button" id="print">Print / PDF</button>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card__head">
      <h2 id="c-company">—</h2>
      <span class="badge badge--outline mono" id="c-ref">—</span>
      <span class="badge" id="c-status">—</span>
      <p id="c-meta" style="margin-left:auto"></p>
    </div>
    <div class="compose">
      <div>
        <label for="f-headline">Opening line</label>
        <input type="text" id="f-headline"
               placeholder="Six of your fourteen tools do a job the platform already does.">
        <p class="field__hint">The first thing the client reads. One sentence, the finding — not a greeting.</p>
      </div>
      <div>
        <label for="f-notes">What you want to say in your own words</label>
        <textarea id="f-notes"
          placeholder="Where you would start, what you would not touch yet, anything the numbers do not show."></textarea>
        <p class="field__hint">Appears at the end of the report, under your name.</p>
      </div>
      <div class="row">
        <span class="small muted" id="edit-count">—</span>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>What the client will see</h2>
    <p>This is the document itself — the same renderer the client portal uses, not an approximation of it.</p>
  </div>

  <div class="preview">
    <div class="preview__chrome">
      <span class="preview__dot" aria-hidden="true"></span>
      <span class="preview__dot" aria-hidden="true"></span>
      <span class="preview__dot" aria-hidden="true"></span>
      <span id="preview-url">client portal · your stack map</span>
    </div>
    <div class="preview__body">
      <h1 id="p-title">Your stack map</h1>
      <p class="muted" id="p-sub" style="margin-top:4px"></p>
      <div id="p-offer"></div>
    </div>
  </div>

  <div class="actionbar">
    <div class="actionbar__text" id="send-state">Not sent yet.</div>
    <button class="btn btn--outline" type="button" id="save">Save draft</button>
    <button class="btn" type="button" id="send">Send to the client</button>
  </div>
</template>

<script src="../stack-tool/catalog.js"></script>
<script src="../shared/om-core.js"></script>
<script>
(function () {
  var content = mountConsoleShell({
    active: 'requests',
    crumbs: [
      { label: 'Mercatify', href: 'requests.html' },
      { label: 'Stack requests', href: 'requests.html' },
      { label: 'Report' }
    ]
  });
  content.appendChild(document.getElementById('tpl').content.cloneNode(true));

  var req = requestByRef(qs('ref'));
  if (!req) {
    content.innerHTML = '<div class="empty">No request to report on yet.</div>';
    return;
  }
  /* A report is a claim about a mapping, so it needs a mapping somebody stood
     behind. Reached before that, this page sends you back rather than letting
     you write a document on top of an unreviewed pass. */
  if (!canReport(req)) {
    content.innerHTML = '';
    content.appendChild(node('div', { class: 'pagehead' }, [
      node('div', { class: 'pagehead__text' }, [
        node('h1', { text: 'Finish the mapping first' }),
        node('p', { text: 'The report is built from the mapping, so it only opens once a ' +
          'consultant has confirmed one. Go through the rows, then press Confirm mapping.' })
      ])
    ]));
    content.appendChild(node('div', { class: 'empty' }, [
      node('div', { text: req.company + ' · ' + req.ref + ' · ' + statusLabel(req) }),
      node('div', { style: 'margin-top:14px' }, [
        node('a', { class: 'btn', href: 'modules.html?ref=' + encodeURIComponent(req.ref) + '#edit',
          text: 'Go to the mapping' })
      ])
    ]));
    return;
  }

  var headlineEl = document.getElementById('f-headline');
  var notesEl = document.getElementById('f-notes');
  headlineEl.value = (req.report && req.report.headline) || '';
  notesEl.value = (req.report && req.report.notes) || '';

  document.getElementById('to-mapping').href = 'modules.html?ref=' + encodeURIComponent(req.ref);
  document.getElementById('c-company').textContent = req.company;
  document.getElementById('c-ref').textContent = req.ref;
  document.getElementById('c-meta').textContent =
    (req.industry || '') + ' · ' + (req.tools || []).length + ' tools · received ' + req.received;

  function draft() {
    /* Compose the report object from the two free-text fields; every figure in
       the preview is derived, so there is nothing else to keep in sync. */
    return {
      headline: headlineEl.value.trim(),
      notes: notesEl.value.trim(),
      generatedAt: (req.report && req.report.generatedAt) || today()
    };
  }

  function render() {
    req.report = draft();
    var offer = buildOffer(req);

    document.getElementById('c-status').textContent = statusLabel(req);
    document.getElementById('c-status').className = statusBadge(req);
    document.getElementById('p-title').textContent = 'Your stack map';
    document.getElementById('p-sub').textContent =
      req.company + ' · ' + offer.caps.length + ' jobs across ' + (req.tools || []).length +
      ' tools · prepared ' + offer.generatedAt;

    var host = document.getElementById('p-offer');
    host.innerHTML = '';
    host.appendChild(renderOffer(offer));

    var edits = offer.caps.filter(function (c) { return c.edited; }).length;
    document.getElementById('edit-count').textContent = edits
      ? edits + (edits === 1 ? ' mapping row was' : ' mapping rows were') + ' edited by hand before this report'
      : 'No mapping row was edited — this is the agent’s pass as it came out';

    var state = document.getElementById('send-state');
    if (req.sentAt) {
      state.textContent = 'Sent to the client on ' + req.sentAt + '. Sending again replaces the version they have.';
      document.getElementById('send').textContent = 'Send the updated report';
    } else {
      state.textContent = 'Not sent yet — the client cannot see any of this.';
    }
    if (req.clientResponse) {
      state.textContent += ' They answered on ' + req.clientResponse.at + ': ' +
        (req.clientResponse.kind === 'accepted' ? 'accepted.' : 'asked for a call with Sales.');
    }
  }

  headlineEl.addEventListener('input', render);
  notesEl.addEventListener('input', render);

  document.getElementById('save').addEventListener('click', function () {
    patchRequest(req.ref, { report: draft(), status: req.status === 'new' ? 'mapping' : req.status });
    req.status = req.status === 'new' ? 'mapping' : req.status;
    this.textContent = 'Draft saved';
    var self = this;
    setTimeout(function () { self.textContent = 'Save draft'; }, 1600);
    render();
  });

  document.getElementById('send').addEventListener('click', function () {
    var report = draft();
    report.sentAt = today();
    patchRequest(req.ref, { report: report, status: 'sent', sentAt: report.sentAt });
    req.report = report; req.status = 'sent'; req.sentAt = report.sentAt;
    render();
    window.alert('Sent. It is now in ' + req.company + '’s portal, where they can accept it or ask for a call.');
  });

  document.getElementById('print').addEventListener('click', function () { window.print(); });

  render();
})();
</script>
</body>
</html>
