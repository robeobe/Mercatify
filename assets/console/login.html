<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console sign in — Mercatify</title>
<link rel="stylesheet" href="../shared/om.css">
</head>
<body>

<div class="auth">
  <div class="auth__card">
    <div class="auth__head">
      <span class="om-mark om-mark--lg" aria-hidden="true">M</span>
      <h1>Mercatify console</h1>
      <p class="auth__sub">Staff access — consulting workspace</p>
    </div>
    <div class="auth__body">
      <form id="login" novalidate>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username"
                 value="ops@mercatify.io" required>
        </div>

        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password"
                 value="secret" required>
        </div>

        <label class="check">
          <input type="checkbox" name="remember" checked>
          <span>Remember me</span>
        </label>

        <div class="alert" id="error" role="alert" hidden>
          <div>Enter an email and a password.</div>
        </div>

        <button class="btn btn--tall" type="submit" id="submit">Sign in</button>
      </form>

      <p class="auth__demo">
        Separate from the client workspace — a client signing in over there never
        reaches this console. Demo only: any email and password get you in.
      </p>
    </div>
  </div>
</div>

<script src="../shared/om-core.js"></script>
<script>
(function () {
  initOmTheme();

  var form = document.getElementById('login');
  var btn = document.getElementById('submit');
  var err = document.getElementById('error');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var pass = document.getElementById('password').value;

    /* The only rejection a mock can honestly make: an empty field. */
    if (!email || !pass) { err.hidden = false; return; }
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Loading...';

    var name = email.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, function (c) {
      return c.toUpperCase();
    });
    writeSession('console', { email: email, name: name, role: 'Consultant' });
    setTimeout(function () { window.location.href = 'requests.html'; }, 450);
  });
})();
</script>
</body>
</html>
