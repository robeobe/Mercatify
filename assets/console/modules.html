<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module coverage — Mercatify</title>
<link rel="stylesheet" href="../shared/om.css">
<style>
  /* Coverage-only pieces. Everything else comes from om.css. */
  .modcard { display: grid; gap: 10px; }
  .modrow {
    display: grid; grid-template-columns: 220px minmax(0, 1fr) auto; gap: 14px; align-items: start;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-xl);
    background: var(--card);
  }
  .modrow--outside { border-style: dashed; }
  .modrow__id { font-size: 0.75rem; color: var(--muted-foreground); }
  .modrow__name { font-weight: 600; font-size: 0.875rem; }
  .modrow__blurb { font-size: 0.75rem; color: var(--muted-foreground); margin-top: 2px; }
  .caplist { display: flex; flex-wrap: wrap; gap: 6px; }
  .capchip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 10px; background: var(--background);
    font: inherit; font-size: 0.75rem; color: inherit; text-align: left;
  }
  .capchip__src { color: var(--muted-foreground); font-size: 0.6875rem; }
  .capchip--dup { border-color: var(--status-warning-border); background: var(--status-warning-bg); color: var(--status-warning-text); }
  .grouphead {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 0.6875rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted-foreground); margin: 20px 0 8px;
  }
  .grouphead::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  /* editable mapping rows */
  #caprows select { height: 32px; min-width: 150px; }
  #caprows input[type="text"] { height: 32px; min-width: 150px; }
  #caprows td { vertical-align: top; }
  .capchip { cursor: pointer; }
  .capchip:hover { border-color: var(--foreground); }
  @keyframes cap-flash { from { background: var(--status-info-bg); } to { background: transparent; } }
  #caprows tr.flash td { animation: cap-flash 1.6s ease-out; }
  @media (max-width: 800px) { .modrow { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="shell"></div>

<template id="tpl">
  <div class="pagehead">
    <div class="pagehead__text">
      <h1>Module coverage</h1>
      <p id="sub">Which Open Mercato modules pick up the work in an incoming request,
         and what is left over. Verdicts come from the capability map — they are a first
         pass a consultant confirms, not a promise.</p>
    </div>
    <div class="pagehead__actions">
      <label class="sr-only" for="pick">Request</label>
      <select id="pick" style="width:auto"></select>
      <a class="btn btn--outline" href="requests.html">Back to queue</a>
      <button class="btn btn--outline" type="button" id="to-edit">Edit the mapping</button>
      <a class="btn" id="to-report">Build the report →</a>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card__head">
      <h2 id="c-company">—</h2>
      <span class="badge badge--outline mono" id="c-ref">—</span>
      <span class="badge" id="c-status">—</span>
      <p id="c-industry" style="margin-left:auto"></p>
    </div>
    <div class="grid grid--2">
      <div>
        <div class="small muted" style="margin-bottom:4px">What hurts today</div>
        <p id="c-pains" class="small">—</p>
      </div>
      <div>
        <div class="small muted" style="margin-bottom:4px">Must not be touched</div>
        <p id="c-keep" class="small">—</p>
      </div>
    </div>
  </div>

  <div class="grid grid--4" style="margin-bottom:8px">
    <div class="stat"><div class="stat__k">Jobs to place</div><div class="stat__v" id="k-caps">0</div><div class="stat__s" id="k-tools">from 0 tools</div></div>
    <div class="stat"><div class="stat__k">Modules involved</div><div class="stat__v" id="k-mods">0</div><div class="stat__s">already installed</div></div>
    <div class="stat"><div class="stat__k">Native or configure</div><div class="stat__v" id="k-covered">0</div><div class="stat__s" id="k-covered-pct">—</div></div>
    <div class="stat"><div class="stat__k">To build</div><div class="stat__v" id="k-build">0</div><div class="stat__s">goes on the estimate</div></div>
  </div>

  <nav class="tabs" style="margin-top:22px">
    <a class="tab" href="#by-module" data-view="module" aria-current="page">Overview by module</a>
    <a class="tab" href="#edit" data-view="capability">
      Edit the mapping<span id="tab-edits" class="badge badge--outline" style="margin-left:6px" hidden></span>
    </a>
  </nav>

  <section id="view-module">
    <div class="alert" style="margin-bottom:12px">
      <div>
        <strong>This is the agent's pass, not a verdict.</strong>
        <span>Click any job below — or use <em>Edit the mapping</em> — to change which module
          takes it over and how hard it is. The report is built from whatever you leave here.</span>
      </div>
    </div>
    <div id="modules"></div>
  </section>

  <section id="view-capability" hidden>
    <div class="alert" style="margin-bottom:12px">
      <div>
        <strong>Every row here is editable.</strong>
        <span>The agent's pass is a starting point — change the module or the verdict where it
          got it wrong, and the report picks the change up. Edited rows are marked.</span>
      </div>
    </div>
    <div class="tablewrap">
      <div class="tablescroll">
        <table>
          <thead>
            <tr>
              <th>Job the client pays for</th>
              <th>Paid for in</th>
              <th>Lands in</th>
              <th>Verdict</th>
              <th>Note for the report</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="caprows"></tbody>
        </table>
      </div>
      <div class="tablefoot"><span id="capfoot">—</span><span id="capedits">no rows edited</span></div>
    </div>
  </section>
</template>

<script src="../stack-tool/catalog.js"></script>
<script src="../shared/om-core.js"></script>
<script>
(function () {
  var content = mountConsoleShell({
    active: 'modules',
    crumbs: [
      { label: 'Mercatify', href: 'requests.html' },
      { label: 'Stack requests', href: 'requests.html' },
      { label: 'Module coverage' }
    ]
  });
  content.appendChild(document.getElementById('tpl').content.cloneNode(true));

  var all = loadRequests();
  var pick = document.getElementById('pick');

  if (!all.length) {
    document.getElementById('modules').innerHTML =
      '<div class="empty">No request has arrived yet. Fill in the intake form and send it.</div>';
    return;
  }

  all.forEach(function (r) {
    pick.appendChild(node('option', { value: r.ref, text: r.ref + ' — ' + r.company }));
  });

  var wanted = qs('ref');
  var current = wanted ? requestByRef(wanted) : all[0];
  pick.value = current.ref;
  pick.addEventListener('change', function () {
    window.location.search = '?ref=' + encodeURIComponent(pick.value);
  });
  document.getElementById('to-report').href = 'report.html?ref=' + encodeURIComponent(current.ref);

  function capChip(c) {
    var chip = node('button', {
      type: 'button',
      class: 'capchip' + (c.duplicate ? ' capchip--dup' : ''),
      onclick: function () { showView('capability', c.cap); }
    }, [
      node('span', { text: c.label }),
      node('span', { class: 'capchip__src', text: c.tools.join(' + ') })
    ]);
    chip.title = (c.duplicate ? 'Paid for in ' + c.tools.length + ' tools today. ' : '') +
      'Click to change where this job lands';
    return chip;
  }

  function renderModules(req) {
    var host = document.getElementById('modules');
    host.innerHTML = '';
    var rows = requestModules(req);

    /* Installed modules first, then the three "not covered" buckets — the
       order a consultant reads it in: what we have, then what it costs. */
    var groups = {};
    rows.forEach(function (r) {
      var g = r.module.group;
      (groups[g] = groups[g] || []).push(r);
    });
    var order = ['Sales', 'Catalog & stock', 'Service', 'Operations', 'Platform', 'Not covered'];
    var names = Object.keys(groups).sort(function (a, b) {
      var ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });

    names.forEach(function (g) {
      var count = groups[g].reduce(function (s, r) { return s + r.caps.length; }, 0);
      host.appendChild(node('div', { class: 'grouphead' }, [
        node('span', { text: g }),
        node('span', { text: count + ' job' + (count === 1 ? '' : 's') })
      ]));

      var wrap = node('div', { class: 'modcard' });
      groups[g].forEach(function (r) {
        var meta = STATUS_META[r.status];
        var outside = r.module.id.indexOf('__') === 0;
        var left = node('div', {}, [
          node('div', { class: 'modrow__name', text: r.module.label }),
          node('div', { class: 'modrow__id mono', text: outside ? '—' : 'modules/' + r.module.id }),
          node('div', { class: 'modrow__blurb', text: r.module.blurb })
        ]);
        var caps = node('div', { class: 'caplist' });
        r.caps.forEach(function (c) { caps.appendChild(capChip(c)); });
        var right = node('div', { style: 'text-align:right;display:grid;gap:4px;justify-items:end' }, [
          node('span', { class: 'badge ' + meta.badge, text: meta.label }),
          node('span', { class: 'small muted', text: r.caps.length + ' job' + (r.caps.length === 1 ? '' : 's') }),
          r.duplicates
            ? node('span', { class: 'badge badge--warning', text: r.duplicates + ' done twice' })
            : node('span', { class: 'small muted', text: meta.hint })
        ]);
        wrap.appendChild(node('div', { class: 'modrow' + (outside ? ' modrow--outside' : '') }, [left, caps, right]));
      });
      host.appendChild(wrap);
    });
  }

  /* The module picker offers every installed module plus the three honest
     non-answers, so a consultant can always say "we would build this". */
  function moduleOptions(selected) {
    var sel = node('select', { class: 'cap-module' });
    var groups = {};
    OM_MODULES.forEach(function (m) { (groups[m.group] = groups[m.group] || []).push(m); });
    Object.keys(groups).forEach(function (g) {
      var og = node('optgroup', { label: g });
      groups[g].forEach(function (m) {
        og.appendChild(node('option', { value: m.id, text: m.label }));
      });
      sel.appendChild(og);
    });
    var og2 = node('optgroup', { label: 'Not covered' });
    Object.keys(OM_OUTSIDE).forEach(function (k) {
      og2.appendChild(node('option', { value: OM_OUTSIDE[k].id, text: OM_OUTSIDE[k].label }));
    });
    sel.appendChild(og2);
    sel.value = selected;
    return sel;
  }

  function verdictOptions(selected) {
    var sel = node('select', { class: 'cap-verdict' });
    Object.keys(STATUS_META).forEach(function (k) {
      sel.appendChild(node('option', { value: k, text: STATUS_META[k].label + ' — ' + STATUS_META[k].hint }));
    });
    sel.value = selected;
    return sel;
  }

  /* An edit writes straight through to the stored override and re-renders the
     whole screen: the module view, the counters and the report all read the
     same numbers, so they cannot disagree with the row you just changed. */
  function editRow(req, cap, patch) {
    setCapOverride(req, cap, patch);
    renderHeader(req);
    renderModules(req);
    renderCaps(req);
  }

  function renderCaps(req) {
    var body = document.getElementById('caprows');
    body.innerHTML = '';
    var caps = requestCaps(req);
    caps.forEach(function (c) {
      var mod = moduleById(c.module);
      var outside = c.module.indexOf('__') === 0;

      var modSel = moduleOptions(c.module);
      modSel.addEventListener('change', function () {
        editRow(req, c.cap, { module: modSel.value, status: c.status });
      });
      var verSel = verdictOptions(c.status);
      verSel.addEventListener('change', function () {
        editRow(req, c.cap, { module: c.module, status: verSel.value });
      });
      var noteInput = node('input', { type: 'text', placeholder: 'why, in one line' });
      noteInput.value = c.note || '';
      /* Notes save on blur rather than per keystroke — a re-render on every
         letter would steal focus from the field being typed into. */
      noteInput.addEventListener('change', function () {
        setCapOverride(req, c.cap, { module: c.module, status: c.status, note: noteInput.value });
        renderCaps(req);
      });

      var reset = node('button', {
        class: 'btn btn--ghost btn--sm', type: 'button', text: 'Reset',
        title: 'Drop the manual edit and go back to what the agent proposed',
        onclick: function () { editRow(req, c.cap, null); }
      });
      if (!c.edited) { reset.disabled = true; }

      body.appendChild(node('tr', { class: c.edited ? 'edited' : '', 'data-cap': c.cap }, [
        node('td', {}, [
          node('span', { style: 'font-weight:500', text: c.label }),
          node('span', { class: 'sub mono', text: c.cap })
        ]),
        node('td', {}, [
          node('span', { text: c.tools.join(', ') }),
          c.duplicate
            ? node('span', { class: 'sub' }, [node('span', { class: 'badge badge--warning', text: 'paid for twice' })])
            : node('span', { class: 'sub', text: 'one tool' })
        ]),
        node('td', {}, [
          modSel,
          node('span', { class: 'sub mono', text: outside ? '—' : 'modules/' + mod.id })
        ]),
        node('td', {}, [
          verSel,
          c.edited
            ? node('span', { class: 'sub' }, [node('span', { class: 'badge badge--outline', text: 'edited by hand' })])
            : node('span', { class: 'sub', text: 'from the agent' })
        ]),
        node('td', {}, [noteInput]),
        node('td', {}, [reset])
      ]));
    });

    var edits = caps.filter(function (c) { return c.edited; }).length;
    document.getElementById('capfoot').textContent =
      caps.length + ' capabilities across ' + (req.tools || []).length + ' tools';
    document.getElementById('capedits').textContent = edits
      ? edits + ' row' + (edits === 1 ? '' : 's') + ' edited by hand'
      : 'no rows edited — all verdicts still the agent’s';
    var tabBadge = document.getElementById('tab-edits');
    tabBadge.hidden = !edits;
    tabBadge.textContent = edits ? String(edits) : '';
  }

  function renderHeader(req) {
    var caps = requestCaps(req);
    var counts = statusCounts(caps);
    var mods = requestModules(req).filter(function (r) { return r.module.id.indexOf('__') !== 0; });
    var covered = counts.native + counts.configure;

    document.getElementById('c-company').textContent = req.company;
    document.getElementById('c-ref').textContent = req.ref;
    var st = document.getElementById('c-status');
    st.textContent = statusLabel(req);
    st.className = statusBadge(req);
    document.getElementById('c-industry').textContent =
      (req.industry || '') + (req.people ? ' · ' + req.people + ' people' : '') +
      ' · ' + fmtMoney(requestMonthly(req), req.currency) + '/mo on licences';
    document.getElementById('c-pains').textContent = req.pains || 'Not stated.';
    document.getElementById('c-keep').textContent = req.mustKeep || 'Not stated.';

    document.getElementById('k-caps').textContent = caps.length;
    document.getElementById('k-tools').textContent = 'from ' + (req.tools || []).length + ' tools';
    document.getElementById('k-mods').textContent = mods.length;
    document.getElementById('k-covered').textContent = covered;
    document.getElementById('k-covered-pct').textContent = caps.length
      ? Math.round(covered / caps.length * 100) + '% of the jobs' : '—';
    document.getElementById('k-build').textContent = counts.build;
  }

  /* ── views ──
     Editing used to live behind a tab called "By capability", which told nobody
     that it was where you correct the agent. It is now named for what it does,
     reachable from the header and from any job chip on the overview, and kept
     in the URL so a reload or a shared link lands back on it. */
  function showView(which, capToFlash) {
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      if (t.getAttribute('data-view') === which) t.setAttribute('aria-current', 'page');
      else t.removeAttribute('aria-current');
    });
    var byModule = which === 'module';
    document.getElementById('view-module').hidden = !byModule;
    document.getElementById('view-capability').hidden = byModule;
    if (history.replaceState) {
      history.replaceState(null, '', window.location.pathname + window.location.search +
        (byModule ? '#by-module' : '#edit'));
    }
    if (capToFlash) {
      var row = document.querySelector('#caprows tr[data-cap="' + capToFlash + '"]');
      if (row) {
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        row.classList.remove('flash');
        void row.offsetWidth;   /* restart the animation if the same row is picked twice */
        row.classList.add('flash');
        var sel = row.querySelector('select.cap-module');
        if (sel) sel.focus({ preventScroll: true });
      }
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
    tab.addEventListener('click', function (e) {
      e.preventDefault();
      showView(tab.getAttribute('data-view'));
    });
  });
  document.getElementById('to-edit').addEventListener('click', function () { showView('capability'); });

  renderHeader(current);
  renderModules(current);
  renderCaps(current);
  if (window.location.hash === '#edit') showView('capability');
})();
</script>
</body>
</html>
