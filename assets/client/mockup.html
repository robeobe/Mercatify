<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Mercato — Voltix Energy</title>
<link rel="icon" href="../../public/open-mercato.svg">
<link rel="stylesheet" href="../shared/om.css">
<style>
  /* The real backend AppShell, traced: a 240px aside with `border-r py-4 px-3`,
     uppercase group labels with a chevron, a `rounded-lg text-sm font-medium`
     item with a 1×5 bar on its left when active, a sticky header whose
     breadcrumb starts at a home icon, and a footer with the version. Widths,
     paddings and type sizes below are those Tailwind classes, in CSS. */
  html, body { margin: 0; height: 100%; }
  body { background: var(--background); color: var(--foreground); }
  .om { display: flex; min-height: 100svh; }
  .om__aside {
    width: 240px; flex: none; border-right: 1px solid var(--border); background: var(--background);
    padding: 16px 12px; position: sticky; top: 0; height: 100svh; display: flex; flex-direction: column; gap: 12px;
  }
  .om__brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .om__brand img { width: 40px; height: 40px; border-radius: 999px; object-fit: cover; }
  .om__brand-name { font-weight: 600; font-size: 0.875rem; line-height: 1.2; }
  .om__brand-org { display: block; font-size: 0.6875rem; line-height: 1rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
  .om__navsearch { position: relative; }
  .om__navsearch input { height: 36px; padding-left: 32px; font-size: 0.875rem; }
  .om__navsearch svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; color: var(--muted-foreground); }
  .om__nav { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-left: -12px; padding-left: 12px; }
  .om__group { display: grid; gap: 4px; }
  .om__grouplabel {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    padding: 4px 4px; background: none; border: 0; cursor: pointer; color: rgb(from var(--muted-foreground) r g b / .7);
    font: inherit; font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: .05em;
  }
  .om__grouplabel svg { width: 14px; height: 14px; transition: transform .15s; }
  .om__group.is-closed .om__grouplabel svg { transform: rotate(-90deg); }
  .om__group.is-closed .om__items { display: none; }
  .om__items { display: grid; gap: 4px; }
  .om__item {
    position: relative; display: inline-flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 12px; border-radius: var(--radius); border: 0; background: none; cursor: pointer; text-align: left;
    font: inherit; font-size: 0.875rem; font-weight: 500; color: var(--muted-foreground);
  }
  .om__item:hover { background: var(--muted); }
  .om__item.is-active { background: var(--muted); color: var(--foreground); }
  .om__item.is-active::before { content: ''; position: absolute; left: -12px; top: 8px; width: 4px; height: 20px; border-radius: 0 4px 4px 0; background: var(--foreground); }
  .om__item svg { width: 16px; height: 16px; flex: none; }
  .om__item .om__lock { margin-left: auto; width: 12px; height: 12px; opacity: .6; }
  .om__item.is-locked { color: rgb(from var(--muted-foreground) r g b / .75); }

  .om__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .om__header {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    background: rgb(from var(--background) r g b / .95); backdrop-filter: blur(8px);
  }
  .om__crumbs { display: flex; align-items: center; gap: 6px; font-size: 0.875rem; color: var(--muted-foreground); margin-left: 12px; }
  .om__crumbs svg { width: 16px; height: 16px; }
  .om__crumbs .cur { color: var(--foreground); font-weight: 500; }
  .om__hright { display: flex; align-items: center; gap: 6px; }
  .om__ibtn { width: 32px; height: 32px; border-radius: var(--radius-md); border: 0; background: none; color: var(--muted-foreground); display: grid; place-items: center; cursor: pointer; position: relative; }
  .om__ibtn:hover { background: var(--muted); color: var(--foreground); }
  .om__ibtn svg { width: 16px; height: 16px; }
  .om__ibtn .dot { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 999px; background: #ef4444; border: 2px solid var(--background); }
  .om__user { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 4px; border-radius: 999px; }
  .om__user:hover { background: var(--muted); }
  .om__user .avatar { width: 28px; height: 28px; font-size: 0.6875rem; }
  .om__content { flex: 1; width: 100%; max-width: 1536px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; align-content: start; }
  .om__footer { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: flex-end; gap: 16px; font-size: 0.75rem; color: var(--muted-foreground); }
  .om__footer a { color: inherit; text-decoration: none; }
  .om__footer a:hover { color: var(--foreground); }

  /* Page + PageHeader */
  .pg__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .pg__head h1 { margin: 0; font-size: 1.5rem; font-weight: 600; line-height: 1.2; }
  .pg__head p { margin: 4px 0 0; font-size: 0.875rem; color: var(--muted-foreground); }
  .pg__actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* DataTable */
  .dt { display: grid; gap: 12px; }
  .dt__bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dt__search { position: relative; width: 260px; }
  .dt__search input { height: 36px; padding-left: 32px; font-size: 0.875rem; }
  .dt__search svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; color: var(--muted-foreground); }
  .dt__frame { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
  .dt table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  .dt thead { background: rgb(from var(--muted) r g b / .4); }
  .dt th { text-align: left; font-weight: 500; color: var(--muted-foreground); height: 40px; padding: 0 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .dt td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .dt tbody tr:last-child td { border-bottom: 0; }
  .dt tbody tr:hover { background: rgb(from var(--muted) r g b / .5); }
  .dt .num, .dt th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .dt .sub { display: block; font-size: 0.75rem; color: var(--muted-foreground); margin-top: 1px; }
  .dt__foot { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 0.875rem; color: var(--muted-foreground); }
  .dt__pager { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .dt__pager button { height: 32px; min-width: 32px; padding: 0 8px; border: 1px solid var(--border); background: var(--background); border-radius: var(--radius-md); color: var(--foreground); font: inherit; font-size: 0.8125rem; cursor: pointer; }
  .dt__pager button[disabled] { opacity: .4; cursor: default; }
  .chk { width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 4px; display: inline-block; vertical-align: middle; }

  /* Dashboard widgets */
  .wg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 900px) { .wg { grid-template-columns: 1fr; } }
  .wg__card { border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--card); padding: 16px; display: grid; gap: 12px; align-content: start; }
  .wg__card--wide { grid-column: span 2; }
  @media (max-width: 900px) { .wg__card--wide { grid-column: span 1; } }
  .wg__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .wg__title { font-size: 0.875rem; font-weight: 600; }
  .wg__big { font-size: 1.75rem; font-weight: 600; letter-spacing: -.01em; line-height: 1; }
  .wg__sub { font-size: 0.75rem; color: var(--muted-foreground); }
  .wg__bars { display: grid; gap: 8px; }
  .wg__bar { display: grid; grid-template-columns: 130px 1fr 60px; gap: 10px; align-items: center; font-size: 0.8125rem; }
  .wg__bar i { display: block; height: 8px; border-radius: 999px; background: var(--muted); overflow: hidden; }
  .wg__bar i b { display: block; height: 100%; background: var(--foreground); border-radius: 999px; }
  .wg__bar .num { text-align: right; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .wg__list { list-style: none; margin: 0; padding: 0; display: grid; }
  .wg__list li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.8125rem; }
  .wg__list li:last-child { border-bottom: 0; }
  .wg__list time { margin-left: auto; color: var(--muted-foreground); font-size: 0.75rem; white-space: nowrap; }

  /* Kanban */
  .kb { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .kb__col { background: rgb(from var(--muted) r g b / .5); border-radius: var(--radius-xl); padding: 10px; display: grid; gap: 8px; align-content: start; }
  .kb__colhead { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-foreground); padding: 2px 4px 6px; }
  .kb__card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 4px; }
  .kb__card b { font-size: 0.8125rem; font-weight: 500; }
  .kb__card span { font-size: 0.75rem; color: var(--muted-foreground); }
  .kb__amt { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.8125rem; }

  /* Inbox list */
  .ib { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
  .ib__row { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
  .ib__row:last-child { border-bottom: 0; }
  .ib__row:hover { background: rgb(from var(--muted) r g b / .5); }
  .ib__row .avatar { width: 32px; height: 32px; font-size: 0.75rem; }
  .ib__subj { font-weight: 500; }
  .ib__prev { display: block; font-size: 0.8125rem; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib__meta { display: grid; justify-items: end; gap: 4px; font-size: 0.75rem; color: var(--muted-foreground); }

  /* Locked page */
  .lk { border: 1px dashed var(--border); border-radius: var(--radius-xl); padding: 28px; display: grid; gap: 14px; justify-items: start; background: rgb(from var(--muted) r g b / .3); }
  .lk__icon { width: 40px; height: 40px; border-radius: var(--radius); background: var(--muted); display: grid; place-items: center; }
  .lk__icon svg { width: 18px; height: 18px; color: var(--muted-foreground); }
  .lk h3 { margin: 0; font-size: 1rem; }
  .lk p { margin: 0; font-size: 0.875rem; color: var(--muted-foreground); max-width: 620px; }
  .lk ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .lk li { font-size: 0.8125rem; display: flex; gap: 8px; align-items: baseline; }
  .lk li span { color: var(--muted-foreground); }

  .om__footer-note { margin-right: auto; }

  .unavailable { max-width: 560px; margin: 80px auto; padding: 24px; }
</style>
</head>

<script src="../stack-tool/catalog.js"></script>

<script>

      node('h1', { text: 'No workspace here yet' }),
      node('p', { class: 'muted', text: mockupEligible(req)

      node('p', {}, [node('a', { class: 'btn btn--outline', href: 'requests.html', text: 'Back to my requests' })])
    ]));
    return;
  }

  var user = currentUser('client');
  var cur = req.currency || 'EUR';
  var caps = requestCaps(req);
  var capsByModule = {};
  caps.forEach(function (c) { (capsByModule[c.module] = capsByModule[c.module] || []).push(c); });
  var capBySlug = {};
  caps.forEach(function (c) { capBySlug[c.cap] = c; });
  function M(n) { return fmtMoney(n, cur); }

  /* ── icons: lucide, traced by hand ── */
  var I = {

    lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',

    n.setAttribute('aria-hidden', 'true'); if (cls) n.setAttribute('class', cls);
    n.innerHTML = I[name] || I.grid; return n;
  }

  /* ── the sidebar of a real tenant ──
     Groups and page titles are the ones the modules declare in their
     page.meta.ts (pageGroup / pageTitle), so the nav reads like the product,
     not like our capability list. `caps` says which mapped jobs a page stands
     for; its status comes from the mapping, so a consultant's override moves

  var GROUP_ORDER = ['Overview', 'Customers', 'Sales', 'Checkout', 'Catalog', 'WMS', 'Shipping', 'AI Inbox Actions', 'Messages',
    'Customer Portal', 'Workflows', 'Business Rules', 'Planner', 'Employees', 'Media', 'Data Designer', 'Content', 'Widgets',
    'External systems', 'Integrations', 'Auth', 'Settings'];
  var UI = {

    customers:        { group: 'Customers', pages: [
      { id: 'people', title: 'People', icon: 'users', caps: ['crm.contacts'], view: 'people' },
      { id: 'companies', title: 'Companies', icon: 'building', caps: ['crm.contacts'], view: 'companies' },
      { id: 'deals', title: 'Deals', icon: 'briefcase', caps: ['crm.pipeline'], view: 'deals' },

      { id: 'cotpl', title: 'Templates', icon: 'file', caps: [], view: 'cotpl' } ] },
    payment_gateways: { group: 'External systems', pages: [{ id: 'paytx', title: 'Payment Transactions', icon: 'card', caps: ['payments'], view: 'paytx' }] },

      crumbs.appendChild(node('span', { text: UI[e.mod].group }));
      crumbs.appendChild(node('span', { text: '›' }));
      crumbs.appendChild(node('span', { class: 'cur', text: e.page.title }));
    } else crumbs.appendChild(node('span', { class: 'cur', text: 'Dashboard' }));
    document.title = e.page.title + ' — Open Mercato';
    content.innerHTML = '';
    var live = e.status === 'native';
    if (live) {
      (VIEWS[e.page.view] || VIEWS.currencies)(e).forEach(function (n) { content.appendChild(n); });
    } else {
      var meta = STATUS_META[e.status];
      var head = pageHead(e, takesOver(e), []);
      head.querySelector('h1').appendChild(node('span', { class: 'badge ' + meta.badge, style: 'margin-left:10px;vertical-align:middle', text: meta.label }));
      content.appendChild(head);
      content.appendChild(locked(e));
    }
    window.scrollTo({ top: 0 });
  }

  /* #/people etc. — so a screen can be linked to, and back/forward work */
  function fromHash() {
    var id = (location.hash || '').replace(/^#\//, '');
    return pagesById[id] ? id : 'dashboard';
  }
  window.addEventListener('hashchange', function () { if (fromHash() !== activeId) show(fromHash()); });
  renderNav('');
  show(fromHash());
})();
</script>
</body>
</html>
